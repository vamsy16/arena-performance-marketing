name: Build flat Emails sheet

# Paste this file at .github/workflows/build-emails-sheet.yml on the main branch.
# It builds niches/food-bengaluru/Food-Bangalore-EMAILS-ONE-SHEET.xlsx (+ .csv) from
# the leads/*.json already in the repo, adds the same tab to the master workbook,
# and commits the result straight to this branch using the repository's own token.

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-emails-sheet.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m pip install --quiet openpyxl
      - name: Build the sheet
        run: |
          python3 - <<'PY'
          import csv, glob, json, re
          from openpyxl import Workbook, load_workbook
          from openpyxl.styles import Alignment, Border, Font, PatternFill, Side
          from openpyxl.utils import get_column_letter

          FB = "niches/food-bengaluru"
          COLS = ["Brand name", "Email", "Subject", "Body 1", "Body 2", "Body 3",
                  "Body 4", "Attachment Name"]

          def plain(t):
              t = re.sub(r"<br\s*/?>", "\n", t)
              t = re.sub(r"</?[bi]>", "", t)
              for a, b in (("&amp;", "&"), ("&lt;", "<"), ("&gt;", ">"),
                           ("&nbsp;", " "), ("&#39;", "'")):
                  t = t.replace(a, b)
              return re.sub(r"\n{3,}", "\n\n", t).strip()

          def slug(s):
              return re.sub(r"[^a-z0-9]+", "-", s.lower()).strip("-")

          data = []
          for p in sorted(glob.glob(f"{FB}/leads/*.json")):
              l = json.load(open(p, encoding="utf-8"))
              subs = [re.sub(r"^Email\s*\d+\s*\(([^)]+)\)\s*:\s*", r"\1: ", s)
                      for s, _ in l["outreach"]]
              bodies = [plain(b) for _, b in l["outreach"]] + ["", "", "", ""]
              data.append((l["score"], [l["brand"], l["contact"]["email"], "\n".join(subs),
                                        *bodies[:4],
                                        f"{slug(l['brand'])}-paid-media-measurement-audit.pdf"]))
          data.sort(key=lambda x: (-x[0], x[1][0]))
          rows = [r for _, r in data]

          def fill(ws):
              ws.append(list(COLS))
              for r in rows:
                  ws.append(r)
              for c in range(1, 9):
                  cell = ws.cell(row=1, column=c)
                  cell.font = Font(bold=True, color="FFFFFF", size=10)
                  cell.fill = PatternFill("solid", fgColor="0F172A")
                  cell.alignment = Alignment(vertical="center", wrap_text=True)
              for i, w in enumerate([22, 30, 44, 34, 34, 34, 34, 42], 1):
                  ws.column_dimensions[get_column_letter(i)].width = w
              wrap = Alignment(wrap_text=True, vertical="top")
              thin = Border(*[Side(style="thin", color="D8DEE8")] * 4)
              for row in ws.iter_rows(min_row=2):
                  for cell in row:
                      cell.alignment = wrap
                      cell.border = thin
              ws.freeze_panes = "A2"

          wb = Workbook()
          ws = wb.active
          ws.title = "Emails"
          fill(ws)
          wb.save(f"{FB}/Food-Bangalore-EMAILS-ONE-SHEET.xlsx")

          with open(f"{FB}/Food-Bangalore-EMAILS-ONE-SHEET.csv", "w", newline="",
                    encoding="utf-8-sig") as fh:
              w = csv.writer(fh)
              w.writerow(COLS)
              for r in rows:
                  w.writerow([r[0], r[1], r[2].replace("\n", " | "), *r[3:]])

          master = f"{FB}/Food-Bangalore-ALL-IN-ONE.xlsx"
          m = load_workbook(master)
          if "Emails (one sheet)" in m.sheetnames:
              del m["Emails (one sheet)"]
          fill(m.create_sheet("Emails (one sheet)"))
          m.save(master)
          print(f"built {len(rows)} rows")
          PY
      - name: Commit straight to this branch
        run: |
          git config user.name "Smart Pursuit Bot"
          git config user.email "smartpursuit3@gmail.com"
          git add niches/food-bengaluru/Food-Bangalore-EMAILS-ONE-SHEET.xlsx \
                  niches/food-bengaluru/Food-Bangalore-EMAILS-ONE-SHEET.csv \
                  niches/food-bengaluru/Food-Bangalore-ALL-IN-ONE.xlsx
          if git diff --cached --quiet; then echo "already up to date"; exit 0; fi
          git commit -m "Add flat Emails sheet (21 leads) from leads/*.json"
          git push || { git checkout -b auto/emails-sheet; git push -u origin auto/emails-sheet; }
