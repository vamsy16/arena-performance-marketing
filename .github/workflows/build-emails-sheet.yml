name: Build Emails sheet

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-emails-sheet.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m pip install --quiet openpyxl
      - name: Build the xlsx and csv
        run: |
          python3 - <<'PY'
          import csv, glob, json, re
          from openpyxl import Workbook, load_workbook
          from openpyxl.styles import Alignment
          from openpyxl.utils import get_column_letter

          COLS = ["Brand name", "Email", "Subject", "Body 1", "Body 2", "Body 3",
                  "Body 4", "Attachment Name"]

          def plain(t):
              t = re.sub(r"<br\s*/?>", "\n", t)
              t = re.sub(r"</?[bi]>", "", t)
              for a, b in (("&amp;", "&"), ("&lt;", "<"), ("&gt;", ">"),
                           ("&nbsp;", " "), ("&#39;", "'")):
                  t = t.replace(a, b)
              return re.sub(r"\n{3,}", "\n\n", t).strip()

          def slug(s):
              return re.sub(r"[^a-z0-9]+", "-", s.lower()).strip("-")

          leads = [json.loads(open(p, encoding="utf-8").read())
                   for p in sorted(glob.glob("niches/food-bengaluru/leads/*.json"))]
          leads.sort(key=lambda d: (-d["score"], d["brand"]))

          rows = []
          for l in leads:
              subs = [re.sub(r"^Email\s*\d+\s*\(([^)]+)\)\s*:\s*", r"\1: ", s)
                      for s, _ in l["outreach"]]
              bodies = [plain(b) for _, b in l["outreach"]] + ["", "", "", ""]
              rows.append([l["brand"], l["contact"]["email"], "\n".join(subs), *bodies[:4],
                           slug(l["brand"]) + "-paid-media-measurement-audit.pdf"])

          def fill(ws):
              ws.append(list(COLS))
              for r in rows:
                  ws.append(r)
              for i, w in enumerate([22, 30, 44, 34, 34, 34, 34, 42], 1):
                  ws.column_dimensions[get_column_letter(i)].width = w
              for row in ws.iter_rows(min_row=2):
                  for c in row:
                      c.alignment = Alignment(wrap_text=True, vertical="top")

          wb = Workbook()
          ws = wb.active
          ws.title = "Emails"
          fill(ws)
          wb.save("niches/food-bengaluru/Food-Bangalore-EMAILS-ONE-SHEET.xlsx")

          with open("niches/food-bengaluru/Food-Bangalore-EMAILS-ONE-SHEET.csv", "w",
                    newline="", encoding="utf-8") as fh:
              w = csv.writer(fh)
              w.writerow(COLS)
              w.writerows(rows)

          m = load_workbook("niches/food-bengaluru/Food-Bangalore-ALL-IN-ONE.xlsx")
          if "Emails (one sheet)" in m.sheetnames:
              del m["Emails (one sheet)"]
          fill(m.create_sheet("Emails (one sheet)"))
          m.save("niches/food-bengaluru/Food-Bangalore-ALL-IN-ONE.xlsx")
          print("built", len(rows), "rows")
          PY
      - name: Attach the files to this run
        uses: actions/upload-artifact@v4
        with:
          name: emails-one-sheet
          path: niches/food-bengaluru/Food-Bangalore-EMAILS-ONE-SHEET.*
      - name: Commit them to the repo
        continue-on-error: true
        run: |
          git config user.name "Smart Pursuit Bot"
          git config user.email "smartpursuit3@gmail.com"
          git add niches/food-bengaluru/Food-Bangalore-EMAILS-ONE-SHEET.xlsx \
                  niches/food-bengaluru/Food-Bangalore-EMAILS-ONE-SHEET.csv \
                  niches/food-bengaluru/Food-Bangalore-ALL-IN-ONE.xlsx
          if git diff --cached --quiet; then echo "already up to date"; exit 0; fi
          git commit -m "Add flat Emails sheet from leads/*.json"
          git push
